# =============================================================================
# Stake It — production-oriented stack
#
# The database is managed (Supabase PostgreSQL), so NO database container runs
# here: the API connects to DATABASE_URL from .env. For a fully local stack with
# its own PostgreSQL, use docker-compose.dev.yml instead.
#
#   cp .env.example .env      # fill in DATABASE_URL (and JWT_SECRET)
#   docker compose build
#   docker compose up -d
#   docker compose logs -f api
#   docker compose down
#
# Build context is the repository root because this is an npm workspaces monorepo.
#
# The explicit project name matters. Docker Compose defaults the project name to
# the containing FOLDER, so this file and docker-compose.dev.yml used to resolve
# to the same project ("stakeit"): their containers shared one namespace and one
# bridge network. Bringing either stack down removed that shared network while
# the other stack's containers still referenced its id, and the next start failed
# with `failed to set up container networking: network <id> not found`. Separate
# names give each stack its own network and container set.
# =============================================================================

name: stakeit-prod

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stake-it-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Trust exactly one proxy hop (the web container) when reading
      # X-Forwarded-* headers, so express-rate-limit sees real client IPs.
      TRUST_PROXY: "1"
    # The API is only reachable from the host loopback in the default stack;
    # nginx reaches it over the compose network as `api:4000`.
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks:
      - stakeit
    healthcheck:
      # `/api/health` reports the database reachability of the API: it answers
      # 503 while the API is still trying to reach the database, and 200 once a
      # connection has succeeded. So "healthy" here means "the API is listening
      # AND the database is reachable" — which is exactly the condition under
      # which a login can succeed.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # A managed pooler (Supabase) can take a while to become routable from the
      # container right after `docker compose up`. The API retries in the
      # background and never exits, so a longer grace period avoids reporting a
      # red container for a database that is simply still waking up.
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin API path; nginx proxies /api to the api service.
        # Set to an absolute URL (e.g. https://api.example.com/api) only when the
        # API is served from a different origin — and add that origin to
        # CORS_ORIGIN in .env.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Stake It}
        VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-true}
    image: stake-it-web:latest
    restart: unless-stopped
    depends_on:
      # Deliberately `service_started` and NOT `service_healthy`.
      #
      # Waiting for the API to become healthy would mean the SPA is unreachable
      # for as long as the database takes to become routable — the browser would
      # get a connection error instead of an explanation. Starting nginx
      # immediately is safe now that the API always has a live listener: nginx
      # can proxy to it, and the API answers 503 with a clear message while the
      # database is still starting, instead of nginx answering 502.
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - stakeit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  stakeit:
    driver: bridge
